<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Pagamentos</title>
    <h:outputStylesheet library="manhattan-layout" name="css/primeflex.min.css"/>
</h:head>

<h:body>
<h:form id="frmPag">

    <p:growl id="msgs" showDetail="true" life="4000"/>

    <p:toolbar styleClass="mb-3">
        <p:toolbarGroup>
            <p:commandButton value="Novo" icon="pi pi-plus"
                             process="@this"
                             update=":dlgPag"
                             oncomplete="PF('dlgPag').show()"
                             actionListener="#{pagamentoController.novo}"/>
            <p:commandButton value="Atualizar" icon="pi pi-refresh" styleClass="ml-2"
                             process="@this"
                             update="tbl"/>
        </p:toolbarGroup>
    </p:toolbar>

    <p:dataTable id="tbl"
                 value="#{pagamentoController.lista}"
                 var="pgt"
                 paginator="true" rows="10"
                 stripedRows="true" styleClass="w-full">

        <p:column headerText="ID" style="width:100px" sortBy="#{pgt.id}">
            <h:outputText value="#{pgt.id}"/>
        </p:column>

        <p:column headerText="Movimentação" sortBy="#{pgt.movimentacao.descricao}">
            <h:outputText value="#{pgt.movimentacao != null ? pgt.movimentacao.descricao : '-'}"/>
        </p:column>

        <p:column headerText="Data" style="width:180px" sortBy="#{pgt.dataPagamento}">
            <h:outputText value="#{pgt.dataPagamento}">
                <f:convertDateTime pattern="dd/MM/yyyy"/>
            </h:outputText>
        </p:column>

        <p:column headerText="Valor" style="width:160px" sortBy="#{pgt.valor}">
            <h:outputText value="#{pgt.valor}">
                <f:convertNumber type="currency" currencySymbol="R$ " minFractionDigits="2"/>
            </h:outputText>
        </p:column>

        <p:column headerText="Forma" style="width:160px" sortBy="#{pgt.forma}">
            <h:outputText value="#{pgt.forma}"/>
        </p:column>

        <p:column headerText="Ações" style="width:220px; text-align:center">
            <p:commandButton icon="pi pi-pencil" title="Editar"
                             actionListener="#{pagamentoController.editar(pgt)}"
                             update=":dlgPag" oncomplete="PF('dlgPag').show()"
                             styleClass="p-button-text p-button-sm"/>
            <p:commandButton icon="pi pi-trash" title="Excluir"
                             actionListener="#{pagamentoController.excluir(pgt)}"
                             update="@form"
                             styleClass="p-button-danger p-button-text p-button-sm"
                             onclick="return confirm('Excluir este pagamento?');"/>
        </p:column>
    </p:dataTable>

    <!-- Diálogo de cadastro/edição -->
    <p:dialog id="dlgPag" header="Pagamento" widgetVar="dlgPag" modal="true" responsive="true" closable="true" width="540">
        <h:panelGrid columns="2" columnClasses="w-3, w-9" styleClass="p-fluid" cellpadding="6">

            <h:outputLabel for="mov" value="Movimentação"/>
            <p:selectOneMenu id="mov"
                             value="#{pagamentoController.movimentacaoSelecionada}"
                             required="true"
                             converter="financeiroMovimentacaoConverter"
                             styleClass="w-full">
                <f:selectItem itemLabel="Selecione..." itemValue="#{null}" noSelectionOption="true"/>
                <f:selectItems value="#{pagamentoController.movimentacoes}"
                               var="mv"
                               itemValue="#{mv}"
                               itemLabel="#{mv.descricao}"/>
            </p:selectOneMenu>

            <h:outputLabel for="dt" value="Data do Pagamento"/>
            <p:datePicker id="dt" pattern="dd/MM/yyyy" showIcon="true"
                          value="#{pagamentoController.pagamento.dataPagamento}" required="true"/>

            <h:outputLabel for="vl" value="Valor"/>
            <p:inputNumber id="vl" decimalPlaces="2" minValue="0"
                           value="#{pagamentoController.pagamento.valor}" required="true"/>

            <h:outputLabel for="forma" value="Forma"/>
            <p:selectOneMenu id="forma" value="#{pagamentoController.pagamento.forma}" required="true">
                <f:selectItem itemLabel="Selecione..." itemValue="#{null}" noSelectionOption="true"/>
                <f:selectItem itemLabel="DINHEIRO" itemValue="DINHEIRO"/>
                <f:selectItem itemLabel="CARTAO" itemValue="CARTAO"/>
                <f:selectItem itemLabel="PIX" itemValue="PIX"/>
                <f:selectItem itemLabel="BOLETO" itemValue="BOLETO"/>
            </p:selectOneMenu>

            <h:outputLabel for="obs" value="Observações"/>
            <p:inputTextarea id="obs" rows="3" autoResize="true" maxlength="255"
                             value="#{pagamentoController.pagamento.observacao}"/>

        </h:panelGrid>

        <f:facet name="footer">
            <p:commandButton value="Salvar" icon="pi pi-check" styleClass="mr-2"
                             actionListener="#{pagamentoController.salvar}"
                             update=":frmPag:msgs :frmPag:tbl"
                             oncomplete="if (!args.validationFailed) PF('dlgPag').hide();"/>
            <p:commandButton value="Cancelar" icon="pi pi-times" type="button"
                             onclick="PF('dlgPag').hide()"/>
        </f:facet>
    </p:dialog>

</h:form>
</h:body>
</html>
