<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Pagamentos</title>
</h:head>

<h:body>
<h:form id="formPagamento">
    <p:messages id="msgs" showDetail="true" closable="true" />

    <p:toolbar styleClass="mb-3">
        <p:toolbarGroup>
            <p:commandButton value="Recarregar" icon="pi pi-refresh"
                             actionListener="#{pagamentoController.carregarLista}"
                             update="tabela msgs"/>
        </p:toolbarGroup>
    </p:toolbar>

    <!-- CORRIGIDO: value -> lista -->
    <p:dataTable id="tabela"
                 value="#{pagamentoController.lista}"
                 var="p"
                 paginator="true" rows="10"
                 emptyMessage="Nenhum pagamento encontrado."
                 styleClass="p-datatable-sm">

        <p:column headerText="ID" sortBy="#{p.id}">
            <h:outputText value="#{p.id}" />
        </p:column>

        <p:column headerText="Data" sortBy="#{p.dataPagamento}">
            <h:outputText value="#{p.dataPagamento}">
                <f:convertDateTime pattern="dd/MM/yyyy" />
            </h:outputText>
        </p:column>

        <p:column headerText="Valor" sortBy="#{p.valor}">
            <h:outputText value="#{p.valor}">
                <f:convertNumber type="currency" currencySymbol="R$ " />
            </h:outputText>
        </p:column>

        <p:column headerText="Movimentação" sortBy="#{p.movimentacao.descricao}">
            <h:outputText value="#{p.movimentacao != null ? p.movimentacao.descricao : '-'}" />
        </p:column>

        <p:column headerText="Ações" style="width: 180px; text-align:center">
            <p:commandButton icon="pi pi-pencil" title="Editar"
                             actionListener="#{pagamentoController.editar(p)}"
                             update="msgs" />
            <p:spacer width="6" />
            <p:commandButton icon="pi pi-trash" title="Excluir"
                             actionListener="#{pagamentoController.excluir(p)}"
                             update="tabela msgs"
                             onclick="return confirm('Confirma excluir?');" />
        </p:column>
    </p:dataTable>
</h:form>
</h:body>
</html>
