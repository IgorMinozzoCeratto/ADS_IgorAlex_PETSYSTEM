<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Financeiro - Cadastro</title>
</h:head>

<h:body>
    <h:form id="form">
        <p:messages id="msgs" showDetail="true" closable="true"/>

        <p:panel header="Cadastro de Movimentação" styleClass="p-mb-3">
            <p:panelGrid columns="2" layout="grid" columnClasses="col-12 md:col-3, col-12 md:col-9" styleClass="p-fluid">

                <!-- Descrição -->
                <p:outputLabel for="descricao" value="Descrição"/>
                <p:inputText id="descricao"
                             value="#{financeiroMovimentacaoController.movimentacao.descricao}"
                             required="true" maxlength="255"/>

                <!-- Valor -->
                <p:outputLabel for="valor" value="Valor"/>
                <p:inputNumber id="valor"
                               value="#{financeiroMovimentacaoController.movimentacao.valor}"
                               required="true" decimalPlaces="2" thousandSeparator="." decimalSeparator=","/>

                <!-- Tipo (R/D) -->
                <p:outputLabel for="tipo" value="Tipo"/>
                <p:selectOneMenu id="tipo"
                                 value="#{financeiroMovimentacaoController.movimentacao.tipo}"
                                 required="true" styleClass="w-full">
                    <f:selectItem itemLabel="Selecione..." itemValue="#{null}" noSelectionOption="true"/>
                    <f:selectItem itemLabel="Receita (R)" itemValue="R"/>
                    <f:selectItem itemLabel="Despesa (D)" itemValue="D"/>
                </p:selectOneMenu>

                <!-- Funcionário Responsável -->
                <p:outputLabel for="funcResp" value="Funcionário Responsável"/>
                <p:selectOneMenu id="funcResp"
                                 value="#{financeiroMovimentacaoController.movimentacao.funcionarioResponsavel}"
                                 converter="funcionarioConverter"
                                 required="true" styleClass="w-full">
                    <f:selectItem itemLabel="Selecione..." itemValue="#{null}" noSelectionOption="true"/>
                    <f:selectItems value="#{financeiroMovimentacaoController.funcionarios}"
                                   var="f" itemValue="#{f}" itemLabel="#{f.nome}"/>
                </p:selectOneMenu>

                <!-- Data da Movimentação (somente leitura por enquanto) -->
                <p:outputLabel for="dataMov" value="Data da Movimentação"/>
                <p:outputLabel id="dataMov"
                               value="#{financeiroMovimentacaoController.movimentacao.dataMovimentacaoFmt}"/>
            </p:panelGrid>

            <div class="p-mt-3">
                <p:commandButton value="Salvar"
                                 action="#{financeiroMovimentacaoController.salvar}"
                                 update=":form:msgs"
                                 styleClass="p-button-success p-mr-2"/>
                <p:button value="Cancelar"
                          outcome="/financeiro/lista.xhtml?faces-redirect=true"
                          styleClass="p-button-secondary"/>
            </div>
        </p:panel>
    </h:form>
</h:body>
</html>
