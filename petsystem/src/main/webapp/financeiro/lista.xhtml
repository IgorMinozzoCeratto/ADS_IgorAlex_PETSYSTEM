<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Financeiro - Movimentações</title>
</h:head>

<h:body>
<h:form id="formFinanceiro">
    <p:messages id="msgs" showDetail="true" closable="true" />

    <p:toolbar styleClass="mb-3">
        <p:toolbarGroup>
            <p:commandButton value="Recarregar" icon="pi pi-refresh"
                             actionListener="#{financeiroMovimentacaoController.carregarLista}"
                             update="tabela msgs"/>
        </p:toolbarGroup>
    </p:toolbar>

    <!-- CORRIGIDO: value -> lista -->
    <p:dataTable id="tabela"
                 value="#{financeiroMovimentacaoController.lista}"
                 var="m"
                 paginator="true" rows="10"
                 emptyMessage="Nenhuma movimentação encontrada."
                 styleClass="p-datatable-sm">

        <p:column headerText="ID" sortBy="#{m.id}">
            <h:outputText value="#{m.id}" />
        </p:column>

        <p:column headerText="Data" sortBy="#{m.data}">
            <h:outputText value="#{m.data}">
                <f:convertDateTime pattern="dd/MM/yyyy" />
            </h:outputText>
        </p:column>

        <p:column headerText="Descrição" sortBy="#{m.descricao}">
            <h:outputText value="#{m.descricao}" />
        </p:column>

        <p:column headerText="Tipo" sortBy="#{m.tipo}">
            <h:outputText value="#{m.tipo}" />
        </p:column>

        <p:column headerText="Valor" sortBy="#{m.valor}">
            <h:outputText value="#{m.valor}">
                <f:convertNumber type="currency" currencySymbol="R$ " />
            </h:outputText>
        </p:column>

        <p:column headerText="Ações" style="width: 180px; text-align:center">
            <p:commandButton icon="pi pi-pencil" title="Editar"
                             actionListener="#{financeiroMovimentacaoController.editar(m)}"
                             update="msgs" />
            <p:spacer width="6" />
            <p:commandButton icon="pi pi-trash" title="Excluir"
                             actionListener="#{financeiroMovimentacaoController.excluir(m)}"
                             update="tabela msgs"
                             onclick="return confirm('Confirma excluir?');" />
        </p:column>
    </p:dataTable>
</h:form>
</h:body>
</html>
