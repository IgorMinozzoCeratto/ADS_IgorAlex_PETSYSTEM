
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Logs de Acesso</title>
    </h:head>

    <h:body>
        <p:panel header="Registros de Log de Acesso">
            <h:form>
                <p:dataTable value="#{logAcessoController.listaLogAcessos}" var="log" emptyMessage="Nenhum registro de log encontrado.">
                    <p:column headerText="ID">
                        <h:outputText value="#{log.id}"/>
                    </p:column>
                    <p:column headerText="Login Tentativa">
                        <h:outputText value="#{log.loginTentativa}"/>
                    </p:column>
                    <p:column headerText="Data/Hora">
                        <h:outputText value="#{log.dataHora}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" timeZone="America/Sao_Paulo"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Sucesso">
                        <h:outputText value="#{log.sucesso ? 'Sim' : 'Não'}"/>
                    </p:column>
                    <p:column headerText="IP Acesso">
                        <h:outputText value="#{log.ipAcesso}"/>
                    </p:column>
                </p:dataTable>
            </h:form>
        </p:panel>
    </h:body>
</html>
