
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Cadastro de Raça</title>
    </h:head>

    <h:body>
        <p:panel header="Cadastro de Raça">
            <h:form>
                <p:messages id="messages" showDetail="true" closable="true"/>

                <p:panelGrid columns="2" layout="grid">
                    <p:outputLabel for="nome" value="Nome:"/>
                    <p:inputText id="nome" value="#{racaController.raca.nome}" required="true" requiredMessage="O nome da raça é obrigatório."/>

                    <p:outputLabel for="especie" value="Espécie:"/>
                    <p:selectOneMenu id="especie" value="#{racaController.raca.especie}" converter="#{especieConverter}" required="true" requiredMessage="A espécie é obrigatória.">
                        <f:selectItem itemLabel="Selecione uma Espécie" itemValue="" noSelectionOption="true"/>
                        <f:selectItems value="#{racaController.listaEspecies}" var="e" itemLabel="#{e.nome}" itemValue="#{e}"/>
                    </p:selectOneMenu>
                </p:panelGrid>

                <p:commandButton value="Salvar" action="#{racaController.salvar()}" update="@form" icon="pi pi-save" styleClass="ui-button-primary"/>
                <p:commandButton value="Voltar" action="lista.xhtml?faces-redirect=true" immediate="true" icon="pi pi-arrow-left" styleClass="ui-button-secondary"/>
            </h:form>
        </p:panel>
    </h:body>
</html>
