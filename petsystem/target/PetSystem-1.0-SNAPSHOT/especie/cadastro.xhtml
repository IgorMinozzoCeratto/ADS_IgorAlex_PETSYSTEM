
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Cadastro de Espécie</title>
    </h:head>

    <h:body>
        <p:panel header="Cadastro de Espécie">
            <h:form>
                <p:messages id="messages" showDetail="true" closable="true"/>

                <p:panelGrid columns="2" layout="grid">
                    <p:outputLabel for="nome" value="Nome:"/>
                    <p:inputText id="nome" value="#{especieController.especie.nome}" required="true" requiredMessage="O nome da espécie é obrigatório."/>
                </p:panelGrid>

                <p:commandButton value="Salvar" action="#{especieController.salvar()}" update="@form" icon="pi pi-save" styleClass="ui-button-primary"/>
                <p:commandButton value="Voltar" action="lista.xhtml?faces-redirect=true" immediate="true" icon="pi pi-arrow-left" styleClass="ui-button-secondary"/>
            </h:form>
        </p:panel>
    </h:body>
</html>
