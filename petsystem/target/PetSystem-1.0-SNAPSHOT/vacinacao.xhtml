<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Registro de Vacinação - PetSystem</title>
</h:head>

<h:body>
<ui:composition template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="card">

            <h:form id="mainForm" prependId="true">
                <p:messages id="msgs" showDetail="true" closable="true" />
                <p:growl id="growl" showDetail="true" />

                <p:tabView id="tabs" widgetVar="tabs" activeIndex="#{vacinacaoController.tabIndex}">
                    <p:tab title="Registro de Vacinação">
                        <div class="ui-fluid">

                            <!-- PRONTUÁRIO (direto no entity) -->
                            <div class="p-field">
                                <p:outputLabel for="prontuario" value="Prontuário:" />
                                <p:selectOneMenu id="prontuario"
                                                 value="#{vacinacaoController.vacinacao.prontuario}"
                                                 required="true"
                                                 requiredMessage="O campo Prontuário é obrigatório"
                                                 converter="prontuarioConverter"
                                                 converterMessage="Não foi possível identificar o prontuário.">
                                    <f:selectItem noSelectionOption="true" itemLabel="Selecione" itemValue="#{null}" />
                                    <f:selectItems value="#{vacinacaoController.prontuarios}" var="prontuario"
                                                   itemLabel="#{prontuario.animal.nome} (ID: #{prontuario.id})"
                                                   itemValue="#{prontuario}" />
                                </p:selectOneMenu>
                                <p:message for="prontuario" />
                            </div>

                            <div class="p-field">
                                <p:outputLabel for="tipoVacina" value="Tipo de Vacina:" />
                                <p:inputText id="tipoVacina"
                                             value="#{vacinacaoController.vacinacao.tipoVacina}"
                                             required="true"
                                             requiredMessage="O campo Tipo de Vacina é obrigatório" />
                                <p:message for="tipoVacina" />
                            </div>

                            <div class="p-field">
                                <p:outputLabel for="dataAplicacao" value="Data da Aplicação:" />
                                <p:datePicker id="dataAplicacao"
                                              value="#{vacinacaoController.vacinacao.dataAplicacao}"
                                              pattern="dd/MM/yyyy"
                                              showIcon="true"
                                              required="true"
                                              requiredMessage="O campo Data da Aplicação é obrigatório" />
                                <p:message for="dataAplicacao" />
                            </div>

                            <div class="p-field">
                                <p:outputLabel for="lote" value="Lote:" />
                                <p:inputText id="lote" value="#{vacinacaoController.vacinacao.lote}" />
                            </div>

                            <!-- FUNCIONÁRIO (direto no entity) -->
                            <div class="p-field">
                                <p:outputLabel for="funcAplic" value="Funcionário Aplicador:" />
                                <p:selectOneMenu id="funcAplic"
                                                 value="#{vacinacaoController.vacinacao.funcionarioAplicador}"
                                                 required="true"
                                                 requiredMessage="O campo Funcionário Aplicador é obrigatório"
                                                 converter="funcionarioConverter"
                                                 converterMessage="Não foi possível identificar o funcionário.">
                                    <f:selectItem noSelectionOption="true" itemLabel="Selecione" itemValue="#{null}" />
                                    <f:selectItems value="#{vacinacaoController.funcionarios}" var="f"
                                                   itemLabel="#{f.nome}" itemValue="#{f}" />
                                </p:selectOneMenu>
                                <p:message for="funcAplic" />
                            </div>

                            <div class="p-field">
                                <p:outputLabel for="observacoes" value="Observações:" />
                                <p:inputTextarea id="observacoes"
                                                 value="#{vacinacaoController.vacinacao.observacoes}"
                                                 rows="5" />
                            </div>

                            <div class="p-field">
                                <p:commandButton value="Salvar"
                                                 action="#{vacinacaoController.salvar}"
                                                 process="@form"
                                                 update=":mainForm:msgs :mainForm:growl :mainForm:tabs :mainForm:tabs:tabela"
                                                 styleClass="ui-button-raised" />
                                <p:commandButton value="Limpar"
                                                 action="#{vacinacaoController.prepararNova}"
                                                 process="@this"
                                                 update=":mainForm"
                                                 styleClass="ui-button-secondary" />
                            </div>

                        </div>
                    </p:tab>

                    <p:tab title="Histórico de Vacinação">
                        <div class="ui-fluid">
                            <div class="p-field">
                                <p:outputLabel for="prontuarioFiltro" value="Filtrar por Prontuário:" />
                                <p:selectOneMenu id="prontuarioFiltro"
                                                 value="#{vacinacaoController.filtroProntuario}"
                                                 converter="prontuarioConverter">
                                    <f:selectItem noSelectionOption="true" itemLabel="Selecione" itemValue="#{null}" />
                                    <f:selectItems value="#{vacinacaoController.prontuarios}" var="p"
                                                   itemLabel="#{p.animal.nome} (ID: #{p.id})"
                                                   itemValue="#{p}" />
                                </p:selectOneMenu>
                                <p:commandButton value="Filtrar"
                                                 action="#{vacinacaoController.filtrar}"
                                                 process="@this"
                                                 update=":mainForm:tabs:tabela" />
                                <p:commandButton value="Limpar Filtro"
                                                 action="#{vacinacaoController.limparFiltro}"
                                                 process="@this"
                                                 update=":mainForm:tabs:tabela prontuarioFiltro" />
                            </div>

                            <p:dataTable id="tabela" value="#{vacinacaoController.vacinacoes}" var="v"
                                         emptyMessage="Nenhum registro de vacinação encontrado"
                                         paginator="true" rows="10"
                                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                         currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} registros"
                                         rowsPerPageTemplate="5,10,15">

                                <p:column headerText="ID">
                                    <h:outputText value="#{v.id}" />
                                </p:column>

                                <p:column headerText="Animal (Prontuário)">
                                    <h:outputText value="#{v.prontuario.animal.nome}" />
                                </p:column>

                                <p:column headerText="Tipo de Vacina">
                                    <h:outputText value="#{v.tipoVacina}" />
                                </p:column>

                                <p:column headerText="Data da Aplicação">
                                    <h:outputText value="#{v.dataAplicacao}">
                                        <f:convertDateTime pattern="dd/MM/yyyy" />
                                    </h:outputText>
                                </p:column>

                                <p:column headerText="Lote">
                                    <h:outputText value="#{v.lote}" />
                                </p:column>

                                <p:column headerText="Funcionário Aplicador">
                                    <h:outputText value="#{v.funcionarioAplicador.nome}" />
                                </p:column>

                                <p:column headerText="Ações" style="width:150px">
                                    <p:commandButton icon="pi pi-pencil"
                                                     action="#{vacinacaoController.prepararEdicao(v)}"
                                                     process="@this"
                                                     update=":mainForm:tabs :mainForm:msgs :mainForm:growl" />
                                    <p:commandButton icon="pi pi-trash"
                                                     action="#{vacinacaoController.excluir(v)}"
                                                     process="@this"
                                                     update=":mainForm:tabs:tabela :mainForm:msgs :mainForm:growl"
                                                     onclick="return confirm('Confirma a exclusão deste registro?');" />
                                </p:column>
                            </p:dataTable>
                        </div>
                    </p:tab>
                </p:tabView>
            </h:form>

        </div>
    </ui:define>
</ui:composition>
</h:body>
</html>
