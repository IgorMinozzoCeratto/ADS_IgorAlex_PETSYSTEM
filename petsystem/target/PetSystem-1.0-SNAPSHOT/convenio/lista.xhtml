
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Lista de Convênios</title>
    </h:head>

    <h:body>
        <p:panel header="Convênios Cadastrados">
            <h:form>
                <p:commandButton value="Novo Convênio" action="cadastro.xhtml" icon="pi pi-plus" styleClass="ui-button-success"/>
                <p:spacer height="10"/>

                <p:dataTable value="#{convenioController.listaConvenios}" var="convenio" emptyMessage="Nenhum convênio encontrado.">
                    <p:column headerText="ID">
                        <h:outputText value="#{convenio.id}"/>
                    </p:column>
                    <p:column headerText="Nome">
                        <h:outputText value="#{convenio.nome}"/>
                    </p:column>
                    <p:column headerText="Descrição">
                        <h:outputText value="#{convenio.descricao}"/>
                    </p:column>
                    <p:column headerText="Ações">
                        <p:commandButton value="Editar" action="#{convenioController.editar(convenio)}" icon="pi pi-pencil" styleClass="ui-button-info"/>
                        <p:commandButton value="Excluir" action="#{convenioController.excluir(convenio)}" icon="pi pi-trash" styleClass="ui-button-danger" update="@form">
                            <p:confirm header="Confirmação" message="Deseja realmente excluir este convênio?" icon="pi pi-exclamation-triangle"/>
                        </p:commandButton>
                    </p:column>
                </p:dataTable>

                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                    <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                    <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes"/>
                </p:confirmDialog>
            </h:form>
        </p:panel>
    </h:body>
</html>
