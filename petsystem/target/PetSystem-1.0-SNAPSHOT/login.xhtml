<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <f:facet name="first">
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
    </f:facet>
    <title>Login - PetSystem</title>

    <!-- Manhattan -->
    <h:outputStylesheet library="manhattan-layout" name="css/primeicons.css" />
    <h:outputStylesheet library="manhattan-layout" name="css/primeflex.min.css" />
    <h:outputStylesheet library="manhattan-layout" name="css/layout-cyan-deeporange.css" />
</h:head>

<h:body styleClass="login-body">
    <h:form id="formLogin">
        <p:growl id="growl" showDetail="true" />

        <div class="grid grid-nogutter">
            <div class="col-12" style="text-align:center">
                <p:graphicImage name="images/logo-manhattan.png" library="manhattan-layout" styleClass="logo" />
            </div>
        </div>

        <div class="login-panel">
            <div class="grid">
                <!-- Imagem lado esquerdo -->
                <div class="col-12 lg:col-6 left-side">
                    <p:graphicImage name="images/login/login-photo.png"
                                    library="manhattan-layout" styleClass="login-image" />
                </div>

                <!-- Form lado direito -->
                <div class="col-12 lg:col-6 right-side ui-fluid">
                    <div class="grid">
                        <div class="col-12">
                            <h3>Bem-vindo!</h3>
                            <h2>Entre no PetSystem</h2>
                        </div>

                        <div class="col-12">
                            <div class="input-wrapper ui-input-icon-left">
                                <i class="pi pi-user" />
                                <p:inputText id="login"
                                             value="#{loginController.login}"
                                             autocomplete="off"
                                             required="true"
                                             requiredMessage="Informe o usuário."
                                             placeholder="Usuário" />
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="input-wrapper ui-input-icon-left">
                                <i class="pi pi-lock" />
                                <p:password id="senha"
                                            value="#{loginController.senha}"
                                            feedback="false"
                                            toggleMask="true"
                                            required="true"
                                            requiredMessage="Informe a senha."
                                            placeholder="Senha" />
                            </div>
                        </div>

                        <div class="col-12 button-container">
                            <p:commandButton value="Acessar"
                                             icon="pi pi-sign-in"
                                             action="#{loginController.autenticar}"
                                             update="growl" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </h:form>

    <!-- Script do layout -->
    <h:outputScript library="manhattan-layout" name="js/layout.js" target="body" />
</h:body>
</html>
