<ui:composition
    template="/WEB-INF/template.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:define name="title">Cadastro de Raça - PetSystem</ui:define>

    <ui:define name="content">
        <div class="card">
            <!-- Painel central e estreito como no print -->
                <p:panel header="Cadastro de Raça" style="max-width:9000px; margin:0 auto;">
                  <h:form>
                    <p:messages id="messages" showDetail="true" closable="true"/>

                    <!-- Grade 2 colunas: 180px (label) | resto (campo centralizado) -->
                    <div style="display:grid; grid-template-columns:180px 1fr; row-gap:22px; margin:22px 0;">

                      <!-- Nome -->
                      <div style="align-self:center;">
                        <p:outputLabel for="nome" value="Nome: *"/>
                      </div>
                      <div style="display:flex; justify-content:center;">
                        <p:inputText id="nome"
                                     value="#{racaController.raca.nome}"
                                     required="true"
                                     requiredMessage="O nome da raça é obrigatório."
                                     style="width:320px;"/>
                      </div>

                      <!-- Espécie -->
                      <div style="align-self:center;">
                        <p:outputLabel for="especie" value="Espécie: *"/>
                      </div>
                      <div style="display:flex; justify-content:center;">
                        <p:selectOneMenu id="especie"
                                         value="#{racaController.raca.especie}"
                                         converter="especieConverter"
                                         required="true"
                                         requiredMessage="A espécie é obrigatória."
                                         style="width:320px;">
                          <f:selectItem itemLabel="Selecione uma Espécie"
                                        itemValue="#{null}" noSelectionOption="true"/>
                          <f:selectItems value="#{racaController.listaEspecies}"
                                         var="e" itemLabel="#{e.nome}" itemValue="#{e}"/>
                        </p:selectOneMenu>
                      </div>

                    </div>

                    <!-- Botões à esquerda, como no print -->
                    <div style="display:flex; gap:.5rem; justify-content:flex-start; margin:10px 0 6px;">
                      <p:commandButton value="Salvar"
                                       action="#{racaController.salvar}"
                                       update="@form messages"
                                       icon="pi pi-save"
                                       styleClass="ui-button-primary"/>
                      <p:commandButton value="Voltar"
                                       action="lista.xhtml?faces-redirect=true"
                                       immediate="true"
                                       icon="pi pi-arrow-left"
                                       styleClass="ui-button-secondary"/>
                    </div>
                  </h:form>
                </p:panel>
        </div>
    </ui:define>
</ui:composition>
