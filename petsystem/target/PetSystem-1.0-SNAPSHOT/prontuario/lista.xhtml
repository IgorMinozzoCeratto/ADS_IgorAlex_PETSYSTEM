<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Lista de Prontuários</title>
    <meta charset="UTF-8" />
    <style>.wrap{max-width:1100px;margin:0 auto;}</style>
</h:head>

<h:body>
    <div class="wrap">
        <p:panel header="Prontuários Cadastrados">
            <h:form id="formLista">
                <p:messages id="msgs" showDetail="true" closable="true" />

                <p:commandButton value="Novo Prontuário"
                                 action="#{prontuarioController.novo}"
                                 icon="pi pi-plus"
                                 styleClass="ui-button-success" />

                <p:spacer height="10" />

                <p:dataTable value="#{prontuarioController.listaProntuarios}"
                             var="p" paginator="true" rows="10" scrollable="true">
                    <p:column headerText="ID" style="width:90px">
                        <h:outputText value="#{p.id}" />
                    </p:column>
                    <p:column headerText="Data" style="width:140px">
                        <h:outputText value="#{p.dataCriacao}">
                            <f:convertDateTime pattern="dd/MM/yyyy" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Animal" style="width:220px">
                        <h:outputText value="#{p.animal.nome}" />
                    </p:column>
                    <p:column headerText="Observações">
                        <h:outputText value="#{p.observacoes}" />
                    </p:column>
                    <p:column headerText="Ações" style="width:230px;white-space:nowrap;">
                        <p:commandButton value="Editar"
                                         action="#{prontuarioController.editar(p)}"
                                         icon="pi pi-pencil"
                                         styleClass="ui-button-warning" />
                        <p:commandButton value="Excluir"
                                         action="#{prontuarioController.excluir(p)}"
                                         icon="pi pi-trash"
                                         styleClass="ui-button-danger"
                                         update=":formLista :formLista:msgs"
                                         style="margin-left:.5rem">
                            <p:confirm header="Confirmação"
                                       message="Deseja realmente excluir este prontuário?"
                                       icon="pi pi-exclamation-triangle" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>

                <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                    <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                    <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes"/>
                </p:confirmDialog>
            </h:form>
        </p:panel>
    </div>
</h:body>
</html>
