
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Cadastro de Movimentação Financeira</title>
    </h:head>

    <h:body>
        <p:panel header="Cadastro de Movimentação Financeira">
            <h:form>
                <p:messages id="messages" showDetail="true" closable="true"/>

                <p:panelGrid columns="2" layout="grid">
                    <p:outputLabel for="descricao" value="Descrição:"/>
                    <p:inputText id="descricao" value="#{financeiroMovimentacaoController.movimentacao.descricao}" required="true" requiredMessage="A descrição é obrigatória."/>

                    <p:outputLabel for="valor" value="Valor:"/>
                    <p:inputNumber id="valor" value="#{financeiroMovimentacaoController.movimentacao.valor}" symbol="R$" symbolPosition="p" decimalSeparator="," thousandSeparator="." required="true" requiredMessage="O valor é obrigatório."/>

                    <p:outputLabel for="tipo" value="Tipo:"/>
                    <p:selectOneRadio id="tipo" value="#{financeiroMovimentacaoController.movimentacao.tipo}" required="true" requiredMessage="O tipo é obrigatório.">
                        <f:selectItem itemLabel="Receita" itemValue="R"/>
                        <f:selectItem itemLabel="Despesa" itemValue="D"/>
                    </p:selectOneRadio>

                    <p:outputLabel for="funcionario" value="Funcionário Responsável:"/>
                    <p:selectOneMenu id="funcionario" value="#{financeiroMovimentacaoController.funcionarioResponsavelSelecionado}" converter="#{funcionarioConverter}" required="true" requiredMessage="O funcionário responsável é obrigatório.">
                        <f:selectItem itemLabel="Selecione um Funcionário" itemValue="" noSelectionOption="true"/>
                        <f:selectItems value="#{financeiroMovimentacaoController.listaFuncionarios}" var="f" itemLabel="#{f.nome}" itemValue="#{f}"/>
                    </p:selectOneMenu>
                </p:panelGrid>

                <p:commandButton value="Salvar" action="#{financeiroMovimentacaoController.salvar()}" update="@form" icon="pi pi-save" styleClass="ui-button-primary"/>
                <p:commandButton value="Voltar" action="lista.xhtml?faces-redirect=true" immediate="true" icon="pi pi-arrow-left" styleClass="ui-button-secondary"/>
            </h:form>
        </p:panel>
    </h:body>
</html>
