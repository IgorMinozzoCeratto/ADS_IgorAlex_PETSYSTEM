<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Movimentações Financeiras</title>
</h:head>
<h:body>
    <h:form id="frmLista">

        <p:messages id="msgs" showDetail="true" closable="true"/>

        <p:toolbar class="mb-3">
            <p:toolbarGroup>
                <p:button value="Novo" icon="pi pi-plus"
                          outcome="/financeiro/cadastro.xhtml"/>
            </p:toolbarGroup>
        </p:toolbar>

        <p:dataTable id="tabela"
                     value="#{financeiroMovimentacaoController.lista}"
                     var="m" paginator="true" rows="10" rowKey="#{m.id}"
                     emptyMessage="Nenhuma movimentação cadastrada.">

            <p:column headerText="ID" style="width:90px;text-align:center">
                <h:outputText value="#{m.id}"/>
            </p:column>

            <p:column headerText="Descrição">
                <h:outputText value="#{m.descricao}"/>
            </p:column>

            <p:column headerText="Valor (R$)" style="width:140px;text-align:right">
                <h:outputText value="#{m.valor}">
                    <f:convertNumber type="currency" currencySymbol="R$ " maxFractionDigits="2" minFractionDigits="2"/>
                </h:outputText>
            </p:column>

            <p:column headerText="Tipo" style="width:120px;text-align:center">
                <h:outputText value="#{m.tipo eq 'R' ? 'Receita' : 'Despesa'}"/>
            </p:column>

            <p:column headerText="Data/Hora" style="width:180px">
                <h:outputText value="#{m.dataMovimentacaoFmt}"/>
            </p:column>

            <p:column headerText="Funcionário">
                <h:outputText value="#{m.funcionarioResponsavel != null ? m.funcionarioResponsavel.nome : '-'}"/>
            </p:column>

            <p:column headerText="Ações" style="width:160px;text-align:center">
                <p:commandButton icon="pi pi-pencil" title="Editar"
                                 action="#{financeiroMovimentacaoController.editar(m)}"
                                 ajax="false"/>
                <p:commandButton icon="pi pi-trash" title="Excluir"
                                 action="#{financeiroMovimentacaoController.excluir(m)}"
                                 update=":frmLista:msgs @this"/>
            </p:column>

        </p:dataTable>

    </h:form>
</h:body>
</html>
