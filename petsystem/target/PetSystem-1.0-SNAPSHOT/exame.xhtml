<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Registro de Exames - PetSystem</title>
</h:head>

<h:body>
<ui:composition template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <div class="card">
            <h:form id="mainForm" prependId="true">
                <p:messages id="msgs" showDetail="true" closable="true" />
                <p:growl id="growl" showDetail="true" />

                <p:tabView id="tabs" widgetVar="tabs" activeIndex="#{exameController.tabIndex}">
                    <p:tab title="Registro de Exame">
                        <div class="ui-fluid">

                            <!-- PRONTUÁRIO (direto no entity) -->
                            <div class="p-field">
                                <p:outputLabel for="prontuario" value="Prontuário:" />
                                <p:selectOneMenu id="prontuario"
                                                 value="#{exameController.exame.prontuario}"
                                                 required="true"
                                                 requiredMessage="O campo Prontuário é obrigatório"
                                                 converter="prontuarioConverter"
                                                 converterMessage="Não foi possível identificar o prontuário.">
                                    <f:selectItem noSelectionOption="true" itemLabel="Selecione" itemValue="#{null}" />
                                    <f:selectItems value="#{exameController.prontuarios}" var="p"
                                                   itemLabel="#{p.animal.nome} (ID: #{p.id})"
                                                   itemValue="#{p}" />
                                </p:selectOneMenu>
                                <p:message for="prontuario" />
                            </div>

                            <div class="p-field">
                                <p:outputLabel for="tipoExame" value="Tipo de Exame:" />
                                <p:inputText id="tipoExame"
                                             value="#{exameController.exame.tipoExame}"
                                             required="true"
                                             requiredMessage="O campo Tipo de Exame é obrigatório" />
                                <p:message for="tipoExame" />
                            </div>

                            <div class="p-field">
                                <p:outputLabel for="dataExame" value="Data do Exame:" />
                                <p:datePicker id="dataExame"
                                              value="#{exameController.exame.dataExame}"
                                              pattern="dd/MM/yyyy"
                                              showIcon="true"
                                              required="true"
                                              requiredMessage="O campo Data do Exame é obrigatório" />
                                <p:message for="dataExame" />
                            </div>

                            <div class="p-field">
                                <p:outputLabel for="resultado" value="Resultado:" />
                                <p:inputTextarea id="resultado"
                                                 value="#{exameController.exame.resultado}"
                                                 rows="5" />
                            </div>

                            <!-- VETERINÁRIO (direto no entity) -->
                            <div class="p-field">
                                <p:outputLabel for="veterinario" value="Veterinário Responsável:" />
                                <p:selectOneMenu id="veterinario"
                                                 value="#{exameController.exame.veterinario}"
                                                 required="true"
                                                 requiredMessage="O campo Veterinário é obrigatório"
                                                 converter="funcionarioConverter"
                                                 converterMessage="Não foi possível identificar o veterinário.">
                                    <f:selectItem noSelectionOption="true" itemLabel="Selecione" itemValue="#{null}" />
                                    <f:selectItems value="#{exameController.veterinarios}" var="v"
                                                   itemLabel="#{v.nome}" itemValue="#{v}" />
                                </p:selectOneMenu>
                                <p:message for="veterinario" />
                            </div>

                            <div class="p-field">
                                <p:outputLabel for="documentoAnexoUrl" value="URL do Documento Anexo:" />
                                <p:inputText id="documentoAnexoUrl"
                                             value="#{exameController.exame.documentoAnexoUrl}" />
                            </div>

                            <div class="p-field">
                                <p:outputLabel for="observacoes" value="Observações:" />
                                <p:inputTextarea id="observacoes"
                                                 value="#{exameController.exame.observacoes}"
                                                 rows="5" />
                            </div>

                            <div class="p-field">
                                <p:commandButton value="Salvar"
                                                 action="#{exameController.salvar}"
                                                 process="@form"
                                                 update=":mainForm:msgs :mainForm:growl :mainForm:tabs :mainForm:tabs:tabela"
                                                 styleClass="ui-button-raised" />
                                <p:commandButton value="Limpar"
                                                 action="#{exameController.prepararNovo}"
                                                 process="@this"
                                                 update=":mainForm"
                                                 styleClass="ui-button-secondary" />
                            </div>
                        </div>
                    </p:tab>

                    <p:tab title="Histórico de Exames">
                        <div class="ui-fluid">
                            <div class="p-field">
                                <p:outputLabel for="prontuarioFiltro" value="Filtrar por Prontuário:" />
                                <p:selectOneMenu id="prontuarioFiltro"
                                                 value="#{exameController.filtroProntuario}"
                                                 converter="prontuarioConverter">
                                    <f:selectItem noSelectionOption="true" itemLabel="Selecione" itemValue="#{null}" />
                                    <f:selectItems value="#{exameController.prontuarios}" var="pf"
                                                   itemLabel="#{pf.animal.nome} (ID: #{pf.id})"
                                                   itemValue="#{pf}" />
                                </p:selectOneMenu>
                                <p:commandButton value="Filtrar"
                                                 action="#{exameController.filtrar}"
                                                 process="@this"
                                                 update=":mainForm:tabs:tabela" />
                                <p:commandButton value="Limpar Filtro"
                                                 action="#{exameController.limparFiltro}"
                                                 process="@this"
                                                 update=":mainForm:tabs:tabela prontuarioFiltro" />
                            </div>

                            <p:dataTable id="tabela" value="#{exameController.exames}" var="e"
                                         emptyMessage="Nenhum registro de exame encontrado"
                                         paginator="true" rows="10"
                                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                         currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} registros"
                                         rowsPerPageTemplate="5,10,15">

                                <p:column headerText="ID">
                                    <h:outputText value="#{e.id}" />
                                </p:column>

                                <p:column headerText="Animal (Prontuário)">
                                    <h:outputText value="#{e.prontuario.animal.nome}" />
                                </p:column>

                                <p:column headerText="Tipo de Exame">
                                    <h:outputText value="#{e.tipoExame}" />
                                </p:column>

                                <p:column headerText="Data do Exame">
                                    <h:outputText value="#{e.dataExame}">
                                        <f:convertDateTime pattern="dd/MM/yyyy" />
                                    </h:outputText>
                                </p:column>

                                <p:column headerText="Veterinário">
                                    <h:outputText value="#{e.veterinario.nome}" />
                                </p:column>

                                <p:column headerText="Ações" style="width:150px">
                                    <p:commandButton icon="pi pi-pencil"
                                                     action="#{exameController.prepararEdicao(e)}"
                                                     process="@this"
                                                     update=":mainForm:tabs :mainForm:msgs :mainForm:growl" />
                                    <p:commandButton icon="pi pi-trash"
                                                     action="#{exameController.excluir(e)}"
                                                     process="@this"
                                                     update=":mainForm:tabs:tabela :mainForm:msgs :mainForm:growl"
                                                     onclick="return confirm('Confirma a exclusão deste registro?');" />
                                </p:column>
                            </p:dataTable>
                        </div>
                    </p:tab>
                </p:tabView>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
</h:body>
</html>
