<ui:composition
    template="/WEB-INF/template.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:define name="title">Pagamentos - Lista - PetSystem</ui:define>

    <ui:define name="content">
        <div class="card">
            <h:form id="formLista">
                <p:growl id="msgs" showDetail="true" />

                <p:toolbar styleClass="p-mb-3">
                    <p:toolbarGroup>
                        <!-- Usa action (não outcome) para inicializar o bean -->
                        <p:commandButton value="Novo" icon="pi pi-plus"
                                         action="#{pagamentoController.novo}" />
                    </p:toolbarGroup>
                </p:toolbar>

                <p:dataTable value="#{pagamentoController.lista}" var="p" paginator="true" rows="10"
                             emptyMessage="Nenhum pagamento encontrado.">
                    <p:column headerText="ID" style="width:90px;text-align:center">
                        <h:outputText value="#{p.id}" />
                    </p:column>
                    <p:column headerText="Tutor">
                        <h:outputText value="#{p.tutor.nome}" />
                    </p:column>
                    <p:column headerText="Valor Pago" style="width:150px;text-align:right">
                        <h:outputText value="#{p.valorPago}">
                            <f:convertNumber type="currency" currencySymbol="R$ " />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Data" style="width:180px;text-align:center">
                        <h:outputText value="#{p.dataPagamento}">
                            <f:convertDateTime pattern="dd/MM/yyyy" timeZone="America/Sao_Paulo"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Ações" style="width:220px;text-align:center">
                        <p:commandButton value="Editar" icon="pi pi-pencil" styleClass="p-button-sm p-mr-2"
                                         action="#{pagamentoController.editar(p)}" />
                        <p:commandButton value="Excluir" icon="pi pi-trash" styleClass="p-button-sm p-button-danger"
                                         actionListener="#{pagamentoController.excluir(p)}"
                                         update=":formLista:msgs :formLista"
                                         process="@this"
                                         onclick="return confirm('Excluir este registro?');" />
                    </p:column>
                </p:dataTable>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
